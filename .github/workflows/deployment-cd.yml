
name: 03 - Publish and Deploy

on:
  workflow_run:
    workflows:
      - "02 - SonarQube Analysis"
    types:
      - completed

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Download JAR artifact from Pipeline 2
        uses: actions/download-artifact@v4
        with:
          name: java-app-jar
          path: downloaded-jar
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish package to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn deploy -DskipTests

      - name: Copy JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            "$EC2_USERNAME@$EC2_HOST" \
            "sudo mkdir -p /opt/java-app && sudo chown $EC2_USERNAME:$EC2_USERNAME /opt/java-app"

          scp -i ~/.ssh/deploy_key \
            downloaded-jar/*.jar \
            "$EC2_USERNAME@$EC2_HOST:/opt/java-app/app.jar"

      - name: Restart Java application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$EC2_USERNAME@$EC2_HOST" \
            "sudo systemctl restart java-app"
