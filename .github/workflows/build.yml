

    
name: Pipeline 1 - Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Verify project structure
      - name: Verify project structure
        run: |
          test -f pom.xml
          test -f src/main/java/com/example/App.java
          test -f src/test/java/com/example/AppTest.java

      # Step 3: Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 4: Compile application
      - name: Compile application
        run: mvn clean compile

      # Step 5: Run JUnit tests
      - name: Run JUnit tests
        run: mvn test

      # Step 6: Package application
      - name: Package application
        run: mvn package

      # Step 7: Upload JAR artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jar
          path: target/*.jar
          if-no-files-found: error
